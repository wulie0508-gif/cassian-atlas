[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "english-learning-tracker"
version = "0.1.0"
description = "Privacy-first local learning records, review queues, and evidence-backed weakness analysis."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "English Learning Tracker contributors"}]
dependencies = []
keywords = ["learning-records", "education", "sqlite", "spaced-repetition", "knowledge-tracing"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
]

[project.optional-dependencies]
parsing = [
  "pypdf>=5,<7",
  "pywin32>=306; platform_system == 'Windows'",
]

[project.scripts]
english-tracker = "english_tracker.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
english_tracker = ["migrations/*.sql", "web/*.html", "web/*.css", "web/*.js"]
