[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "cassian-atlas"
version = "0.5.0"
description = "Local-first evidence OS for agent-native tutoring."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Cassian Atlas contributors"}]
dependencies = []
keywords = ["learning-records", "education", "sqlite", "ai-agents", "spaced-repetition", "knowledge-tracing"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
]

[project.urls]
Homepage = "https://github.com/wulie0508-gif/cassian-atlas"
Repository = "https://github.com/wulie0508-gif/cassian-atlas"
Issues = "https://github.com/wulie0508-gif/cassian-atlas/issues"

[project.optional-dependencies]
parsing = [
  "pypdf>=5,<7",
  "pywin32>=306; platform_system == 'Windows'",
]

[project.scripts]
cassian = "english_tracker.cli:main"
cassian-atlas = "english_tracker.cli:main"
opentutor = "english_tracker.cli:main"
english-tracker = "english_tracker.cli:main"
open-tutor-ledger = "english_tracker.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
english_tracker = ["migrations/*.sql", "web/*.html", "web/*.css", "web/*.js", "web/*.svg"]
