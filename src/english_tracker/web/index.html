<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="胡楠英语学习项目本地管理与数据可视化">
  <title>胡楠英语 · Learning Hub</title>
  <link rel="stylesheet" href="/assets/styles.css">
</head>
<body>
  <a class="skip-link" href="#main-content">跳到主要内容</a>
  <div class="app-shell">
    <aside class="sidebar" aria-label="主导航">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">H</span>
        <div>
          <strong>胡楠英语</strong>
          <small>Learning Hub</small>
        </div>
      </div>
      <nav class="nav-list">
        <button class="nav-item is-active" data-view="overview"><span aria-hidden="true">◫</span>项目总览</button>
        <button class="nav-item" data-view="question-bank"><span aria-hidden="true">⌕</span>题库与知识</button>
        <button class="nav-item" data-view="mastery"><span aria-hidden="true">◒</span>学情掌握</button>
        <button class="nav-item" data-view="assessments"><span aria-hidden="true">✓</span>测试校准</button>
        <button class="nav-item" data-view="library"><span aria-hidden="true">↻</span>解析中心</button>
        <button class="nav-item" data-view="dictation"><span aria-hidden="true">Aa</span>单词听写</button>
        <button class="nav-item" data-view="workflow"><span aria-hidden="true">⇄</span>三个对话</button>
      </nav>
      <div class="sidebar-foot">
        <div class="health-dot" id="health-dot" aria-hidden="true"></div>
        <div><strong id="health-label">连接中</strong><small>本机 127.0.0.1</small></div>
      </div>
    </aside>

    <main id="main-content" tabindex="-1">
      <header class="topbar">
        <div>
          <p class="eyebrow" id="section-eyebrow">PROJECT CONTROL</p>
          <h1 id="page-title">项目总览</h1>
        </div>
        <div class="topbar-actions">
          <span class="freshness" id="freshness">正在读取真实数据…</span>
          <button class="button button-secondary" id="refresh-button" type="button">刷新</button>
        </div>
      </header>

      <section id="view" class="view" aria-live="polite">
        <div class="loading-state" aria-busy="true" aria-label="正在加载">
          <div class="skeleton skeleton-title"></div>
          <div class="skeleton-grid"><div></div><div></div><div></div></div>
        </div>
      </section>
    </main>
  </div>

  <dialog id="question-dialog" class="detail-dialog">
    <form method="dialog" class="dialog-head">
      <div><p class="eyebrow">QUESTION DETAIL</p><h2 id="dialog-title">题目详情</h2></div>
      <button class="icon-button" aria-label="关闭题目详情">×</button>
    </form>
    <div id="dialog-body" class="dialog-body"></div>
  </dialog>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="/assets/app.js" defer></script>
</body>
</html>
