<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Cassian Atlas — local-first learning evidence for humans and agents">
  <title>Cassian Atlas</title>
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/assets/styles.css">
</head>
<body>
  <a class="skip-link" href="#main-content">跳到主要内容</a>
  <div class="app-shell">
    <aside class="sidebar" aria-label="主导航">
      <div class="brand">
        <svg class="brand-mark" aria-hidden="true" viewBox="0 0 64 64">
          <path d="M10 17c8-3 15-1 22 5v27c-7-6-14-8-22-5V17Z"/>
          <path d="M54 17c-8-3-15-1-22 5v27c7-6 14-8 22-5V17Z"/>
          <circle cx="20" cy="28" r="2.5"/><circle cx="44" cy="28" r="2.5"/>
        </svg>
        <div>
          <strong>Cassian Atlas</strong>
          <small>LEDGER</small>
        </div>
      </div>
      <nav class="nav-list">
        <div class="nav-group nav-group-teaching">
          <p class="nav-group-label">教学</p>
          <button class="nav-item is-active" data-view="overview" aria-current="page"><svg class="nav-icon" aria-hidden="true" viewBox="0 0 24 24"><path d="M4 4h6v7H4zM14 4h6v4h-6zM14 12h6v8h-6zM4 15h6v5H4z"/></svg><span>教学总览</span></button>
          <button class="nav-item" data-view="mastery"><svg class="nav-icon" aria-hidden="true" viewBox="0 0 24 24"><path d="M4 19V9m5 10V5m5 14v-7m5 7V3"/></svg><span>趋势与薄弱点</span></button>
          <button class="nav-item" data-view="assessments"><svg class="nav-icon" aria-hidden="true" viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></svg><span>课程与测验</span></button>
          <button class="nav-item" data-view="dictation"><svg class="nav-icon" aria-hidden="true" viewBox="0 0 24 24"><path d="M7 18 12 5l5 13M9 14h6M18 6v7m-3-3h6"/></svg><span>词汇复测</span></button>
        </div>
        <div class="nav-group nav-group-system" id="mobile-more-menu">
          <p class="nav-group-label">资料与系统</p>
          <button class="nav-item" data-view="question-bank"><svg class="nav-icon" aria-hidden="true" viewBox="0 0 24 24"><path d="M5 5.5c3.2-1.1 5.5-.5 7 1.4v12c-1.5-1.9-3.8-2.5-7-1.4v-12Zm14 0c-3.2-1.1-5.5-.5-7 1.4v12c1.5-1.9 3.8-2.5 7-1.4v-12Z"/></svg><span>题库检索</span></button>
          <button class="nav-item" data-view="library"><svg class="nav-icon" aria-hidden="true" viewBox="0 0 24 24"><path d="M6 4h12v16H6zM9 8h6M9 12h6M9 16h4"/></svg><span>资料解析</span></button>
          <button class="nav-item" data-view="workflow"><svg class="nav-icon" aria-hidden="true" viewBox="0 0 24 24"><path d="M4 7h12m0 0-3-3m3 3-3 3M20 17H8m0 0 3-3m-3 3 3 3"/></svg><span>Agent 运行</span></button>
        </div>
        <button class="nav-item more-nav-button" id="more-nav-button" type="button" aria-expanded="false" aria-controls="mobile-more-menu"><svg class="nav-icon" aria-hidden="true" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="19" cy="12" r="1.4"/></svg><span>更多</span></button>
      </nav>
      <div class="sidebar-foot">
        <div class="health-dot" id="health-dot" aria-hidden="true"></div>
        <div><strong id="health-label">连接中</strong><small>本机 127.0.0.1</small></div>
      </div>
    </aside>

    <main id="main-content" tabindex="-1">
      <header class="topbar">
        <div>
          <p class="eyebrow" id="section-eyebrow">PROJECT CONTROL</p>
          <h1 id="page-title">项目总览</h1>
        </div>
        <div class="topbar-actions">
          <span class="freshness" id="freshness">正在读取真实数据…</span>
          <label class="compact-control student-control"><span>学生</span><select id="student-select" aria-label="选择学生"></select></label>
          <label class="compact-control subject-control"><span>学科</span><select id="subject-select" aria-label="选择学科"></select></label>
          <button class="button button-secondary settings-button" id="settings-button" type="button" aria-expanded="false" aria-controls="settings-menu">设置</button>
          <div class="settings-menu" id="settings-menu">
            <label class="compact-control locale-control"><span>语言</span><select id="locale-select" aria-label="选择界面语言"><option value="zh-CN">中文</option><option value="en">English</option></select></label>
            <button class="button button-secondary mode-button" id="detail-mode-button" type="button" aria-pressed="false">查看专业数据</button>
          </div>
          <button class="button button-secondary" id="refresh-button" type="button">刷新</button>
        </div>
      </header>

      <div id="app-status" class="sr-only" role="status" aria-live="polite"></div>
      <section id="view" class="view" aria-busy="true">
        <div class="loading-state" aria-busy="true" aria-label="正在加载">
          <div class="skeleton skeleton-title"></div>
          <div class="skeleton-grid"><div></div><div></div><div></div></div>
        </div>
      </section>
    </main>
  </div>

  <dialog id="question-dialog" class="detail-dialog" aria-labelledby="dialog-title">
    <form method="dialog" class="dialog-head">
      <div><p class="eyebrow">QUESTION DETAIL</p><h2 id="dialog-title">题目详情</h2></div>
      <button class="icon-button" aria-label="关闭题目详情">×</button>
    </form>
    <div id="dialog-body" class="dialog-body"></div>
  </dialog>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="/assets/i18n.js" defer></script>
  <script src="/assets/app.js" defer></script>
</body>
</html>
