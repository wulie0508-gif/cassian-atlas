name: Cassian Atlas CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test-matrix:
    name: tests / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install -e .
      - name: Unit tests
        run: python -m unittest discover -s tests -v

  privacy:
    name: privacy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Privacy release gate
        run: |
          python scripts/release_privacy_audit.py
          python scripts/release_privacy_audit.py --history

  required-test:
    # Keep this exact check name aligned with the protected main branch.
    # It succeeds only when the full Python matrix and privacy gate succeed.
    name: test
    if: ${{ always() }}
    needs: [test-matrix, privacy]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify required checks
        env:
          MATRIX_RESULT: ${{ needs.test-matrix.result }}
          PRIVACY_RESULT: ${{ needs.privacy.result }}
        run: |
          test "$MATRIX_RESULT" = "success"
          test "$PRIVACY_RESULT" = "success"
